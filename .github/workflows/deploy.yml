# Publie Odyssia sur GitHub Pages à chaque push.
#
# À activer une seule fois : Settings → Pages → Source → « GitHub Actions ».
name: Déploiement

on:
  push:
    branches: [main, claude/life-simulator-bitlife-ia1vlc]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; les pushes suivants annulent le précédent.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verifier:
    name: Tests et typage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm test

  construire:
    name: Construction
    needs: verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compiler
        # Le site est servi depuis /<nom-du-dépôt>/ sur GitHub Pages.
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deployer:
    name: Mise en ligne
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
